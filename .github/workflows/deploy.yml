name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist/ to SiteGround
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          # lftp reads this itself via --env-password, so the password never
          # appears in a command line or process listing.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Repo variable, not a secret, so the target is visible in the UI.
          # Point it at a staging folder until you are ready to go live.
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_TARGET_DIR:-}" ]; then
            echo "::error::FTP_TARGET_DIR repository variable is not set. Refusing to guess a target directory."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # TEMP DIAGNOSTIC: have lftp report the certificate it is shown, and
          # confirm the credentials work, with verification off for this probe only.
          echo "--- probe ---"
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            open --env-password -u '${FTP_USER}' '${FTP_HOST}';
            echo '== pwd ==';   pwd;
            echo '== ls / =='; cls -l /;
            echo '== ls target =='; (cls -l '${FTP_TARGET_DIR}' || echo 'TARGET DOES NOT EXIST');
          " 2>&1 | grep -viE "certificate|^WARNING" | head -40 || true
          echo "--- end probe ---"

          # mirror --reverse --delete makes the remote directory match dist/
          # exactly. Anything already in FTP_TARGET_DIR that is not in dist/
          # gets removed, so make sure that directory holds nothing else.
          # Bash has to expand these before lftp sees them — lftp does no
          # variable expansion of its own, so escaping the dollars sends it the
          # literal string "$FTP_HOST" and it fails to resolve a host by that name.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 20;
            open --env-password -u '${FTP_USER}' '${FTP_HOST}';
            mirror --reverse --delete --parallel=4 --verbose=1 \
              --exclude-glob .well-known/ \
              dist/ '${FTP_TARGET_DIR}';
          "
          echo "Deployed to $FTP_TARGET_DIR"
